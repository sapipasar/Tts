<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Indo - Pria & Wanita</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 10px; padding: 12px; box-sizing: border-box; margin-top: 5px; resize: none; }
        select { width: 100%; padding: 12px; background: #334155; color: white; border: none; border-radius: 8px; margin-top: 5px; }
        .btn-group { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
        button { padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        #playBtn { background: #0ea5e9; color: white; }
        #playBtn:active { background: #0284c7; }
        #status { text-align: center; margin-top: 15px; font-size: 13px; color: #38bdf8; min-height: 20px; }
        #downloadArea { display: none; margin-top: 15px; background: #334155; padding: 10px; border-radius: 10px; text-align: center; }
        .dl-link { color: #22c55e; font-weight: bold; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>TTS Indonesia Pro</h2>
    
    <label style="font-size: 13px; color: #94a3b8;">Tulis Teks:</label>
    <textarea id="txt" placeholder="Halo, pripun kabare mas?"></textarea>

    <label style="font-size: 13px; color: #94a3b8;">Pilih Suara:</label>
    <select id="voiceSelect">
        <option value="wanita">Wanita Indonesia (Jernih)</option>
        <option value="pria">Pria Indonesia (Berat/Deep)</option>
        <option value="jawa">Logat Jawa (Slow/Medok)</option>
    </select>

    <div class="btn-group">
        <button id="playBtn">PUTAR & SIAPKAN DOWNLOAD</button>
    </div>

    <div id="status">Klik tombol di atas untuk cek suara.</div>

    <div id="downloadArea">
        <span style="font-size: 12px;">File Siap:</span><br>
        <a id="finalDl" class="dl-link" download="suara_tts.wav">KLIK DISINI UNTUK SIMPAN KE HP</a>
    </div>
</div>

<script>
    const playBtn = document.getElementById('playBtn');
    const txt = document.getElementById('txt');
    const voiceSelect = document.getElementById('voiceSelect');
    const status = document.getElementById('status');
    const downloadArea = document.getElementById('downloadArea');
    const finalDl = document.getElementById('finalDl');

    playBtn.onclick = () => {
        const text = txt.value;
        if (!text) return alert("Isi teks dulu!");

        window.speechSynthesis.cancel(); // Reset suara jika sedang ada yang jalan

        const choice = voiceSelect.value;
        let pitch = 1.0;
        let rate = 1.0;

        if (choice === "pria") { pitch = 0.5; rate = 0.9; }
        else if (choice === "jawa") { pitch = 0.9; rate = 0.7; }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID';
        utterance.pitch = pitch;
        utterance.rate = rate;

        utterance.onstart = () => {
            status.innerText = "🔊 Sedang memutar...";
            playBtn.disabled = true;
        };

        utterance.onend = () => {
            status.innerText = "✅ Selesai diputar.";
            playBtn.disabled = false;
            
            // Karena kita tidak bisa merekam internal dengan mudah di browser tanpa izin mic,
            // Kita gunakan link alternatif yang lebih aman dari error 404
            const altDl = `https://api.voicerss.org/?key=89d2d47f123447998244983056087796&hl=id-id&v=Linda&src=${encodeURIComponent(text)}&r=${choice === 'jawa' ? -3 : 0}`;
            
            // Tampilkan link download setelah diputar
            downloadArea.style.display = "block";
            finalDl.href = altDl;
        };

        window.speechSynthesis.speak(utterance);
    };
</script>

</body>
</html>
