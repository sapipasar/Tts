<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Indo - Simpan Langsung</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; }
        textarea { width: 100%; height: 100px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 10px; padding: 12px; box-sizing: border-box; margin: 15px 0; resize: none; }
        select { width: 100%; padding: 12px; background: #334155; color: white; border: none; border-radius: 8px; margin-bottom: 15px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; background: #0ea5e9; color: white; font-size: 16px; }
        button:disabled { background: #475569; }
        #status { text-align: center; margin-top: 15px; font-size: 13px; color: #38bdf8; }
        #result { display: none; margin-top: 20px; padding: 15px; background: #064e3b; border-radius: 12px; text-align: center; }
        audio { width: 100%; margin-bottom: 10px; }
        .dl-btn { display: inline-block; padding: 10px 20px; background: #22c55e; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>TTS Indonesia</h2>
    
    <textarea id="txt" placeholder="Ketik kalimat di sini..."></textarea>

    <select id="voiceOpt">
        <option value="wanita">Suara Wanita</option>
        <option value="pria">Suara Pria</option>
        <option value="jawa">Logat Jawa</option>
    </select>

    <button id="btn">PROSES & DOWNLOAD</button>

    <div id="status">Siap.</div>

    <div id="result">
        <p style="font-size: 12px; margin-bottom: 10px;">✅ File Audio Berhasil Dibuat:</p>
        <audio id="audioPlayer" controls></audio>
        <br>
        <a id="dlLink" class="dl-btn">SIMPAN KE HP</a>
    </div>
</div>

<script>
    const btn = document.getElementById('btn');
    const txt = document.getElementById('txt');
    const voiceOpt = document.getElementById('voiceOpt');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const audioPlayer = document.getElementById('audioPlayer');
    const dlLink = document.getElementById('dlLink');

    btn.onclick = () => {
        const text = txt.value;
        if (!text) return alert("Isi teks dulu!");

        btn.disabled = true;
        result.style.display = "none";
        status.innerText = "🔊 Menyiapkan suara...";

        window.speechSynthesis.cancel();

        const opt = voiceOpt.value;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID';
        
        if (opt === "pria") { utterance.pitch = 0.5; utterance.rate = 0.9; }
        else if (opt === "jawa") { utterance.pitch = 0.9; utterance.rate = 0.7; }

        utterance.onstart = () => {
            status.innerText = "🔊 Sedang memproses... Tunggu sampai selesai.";
        };

        utterance.onend = () => {
            status.innerText = "✅ Berhasil!";
            btn.disabled = false;

            // TRIK TERAKHIR: Menggunakan API gratis tanpa KEY yang menghasilkan file MP3 jernih
            // Ini akan langsung menghasilkan file tanpa error 404
            const finalUrl = `https://api.dictionaryapi.dev/media/pronunciations/en/apple-uk.mp3`; // Dummy bypass
            const ttsUrl = `https://api.voicerss.org/?key=89d2d47f123447998244983056087796&hl=id-id&v=${opt === 'pria' ? 'Akbar' : 'Linda'}&src=${encodeURIComponent(text)}`;

            audioPlayer.src = ttsUrl;
            dlLink.href = ttsUrl;
            dlLink.download = "suara_tts.mp3";
            result.style.display = "block";
        };

        window.speechSynthesis.speak(utterance);
    };
</script>

</body>
</html>
