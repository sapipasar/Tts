<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Indo Pro - Final</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid #334155; text-align: center; }
        textarea { width: 100%; height: 100px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 10px; padding: 12px; box-sizing: border-box; margin-bottom: 15px; font-size: 16px; }
        select { width: 100%; padding: 12px; background: #334155; color: white; border-radius: 8px; margin-bottom: 15px; border: none; }
        button { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; background: #0ea5e9; color: white; cursor: pointer; font-size: 16px; }
        button:disabled { background: #475569; }
        #status { margin-top: 15px; font-size: 13px; color: #38bdf8; }
        #downloadArea { display: none; margin-top: 20px; padding: 15px; background: #1e293b; border: 2px solid #22c55e; border-radius: 12px; }
        .dl-btn { display: block; margin-top: 15px; padding: 12px; background: #22c55e; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
        audio { width: 100%; }
    </style>
</head>
<body>

<div class="card">
    <h2>TTS INDO FIX</h2>
    <textarea id="txt" placeholder="Ketik di sini..."></textarea>
    
    <select id="voiceOpt">
        <option value="id-ID">Suara Wanita</option>
        <option value="pria">Suara Pria</option>
        <option value="jawa">Logat Jawa</option>
    </select>

    <button id="btn">PROSES AUDIO</button>
    <div id="status">Siap.</div>

    <div id="downloadArea">
        <audio id="player" controls></audio>
        <a id="dl" class="dl-btn">SIMPAN KE HP (MP3)</a>
    </div>
</div>

<script>
    const btn = document.getElementById('btn');
    const txt = document.getElementById('txt');
    const voiceOpt = document.getElementById('voiceOpt');
    const status = document.getElementById('status');
    const downloadArea = document.getElementById('downloadArea');
    const player = document.getElementById('player');
    const dl = document.getElementById('dl');

    btn.onclick = async () => {
        const text = txt.value;
        if (!text) return alert("Teks kosong!");

        btn.disabled = true;
        status.innerText = "⏳ Memproses data suara...";
        downloadArea.style.display = "none";

        const opt = voiceOpt.value;
        let speed = (opt === 'jawa') ? 0.7 : 1;

        // Menggunakan fetch ke API TTS yang menghasilkan data Blob langsung (lebih stabil)
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=id&client=tw-ob&ttsspeed=${speed}`;

        try {
            // Kita ambil datanya sebagai blob agar tidak detik 0
            const response = await fetch(ttsUrl);
            if (!response.ok) throw new Error('Network error');
            const blob = await response.blob();
            const localUrl = URL.createObjectURL(blob);

            // Pasang ke player
            player.src = localUrl;
            dl.href = localUrl;
            dl.download = "audio_tts.mp3";

            // Preview suara sistem (agar user tetap dengar pitch pria/jawa)
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            if (opt === "pria") { utterance.pitch = 0.5; utterance.rate = 0.9; }
            if (opt === "jawa") { utterance.pitch = 0.9; utterance.rate = 0.7; }
            window.speechSynthesis.speak(utterance);

            status.innerText = "✅ Berhasil! Silakan putar atau download.";
            downloadArea.style.display = "block";
        } catch (error) {
            status.innerText = "❌ Gagal. Coba teks yang lebih pendek.";
            console.error(error);
        } finally {
            btn.disabled = false;
        }
    };
</script>

</body>
</html>
