<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video TTS Indonesia - Final Mobile</title>
    <!-- Library untuk Recording yang lebih stabil di Mobile -->
    <script src="https://www.webrtc-experiment.com/RecordRTC.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; padding: 20px; }
        .container { background: #1e1e1e; padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00e5ff; }
        textarea { width: 100%; height: 80px; border-radius: 8px; padding: 10px; margin: 10px 0; box-sizing: border-box; background: #2c2c2c; color: white; border: 1px solid #444; }
        button { width: 100%; padding: 15px; background: #00e5ff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: #121212; font-size: 16px; margin-top: 10px; }
        button:disabled { background: #555; cursor: not-allowed; }
        #outputContainer { margin-top: 20px; display: none; text-align: center; }
        video { width: 100%; border-radius: 10px; border: 2px solid #333; margin-bottom: 10px; }
        .status { margin-top: 10px; font-size: 14px; color: #bbb; text-align: center; }
        .download-btn { display: inline-block; padding: 10px 20px; background: #22c55e; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Video + TTS Indo</h2>
    <p class="status">Versi Galeri Support</p>

    <label>Pilih Video:</label>
    <input type="file" id="videoInput" accept="video/*">

    <label>Teks Suara:</label>
    <textarea id="ttsInput" placeholder="Hai kak gimana kabarnya"></textarea>

    <button id="processBtn">MULAI PROSES</button>
    <p id="infoStatus" class="status"></p>

    <div id="outputContainer">
        <video id="outputVideo" controls playsinline></video>
        <a id="downloadLink" class="download-btn">SIMPAN KE GALERI</a>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const videoInput = document.getElementById('videoInput');
    const ttsInput = document.getElementById('ttsInput');
    const processBtn = document.getElementById('processBtn');
    const infoStatus = document.getElementById('infoStatus');
    const outputVideo = document.getElementById('outputVideo');
    const downloadLink = document.getElementById('downloadLink');
    const outputContainer = document.getElementById('outputContainer');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    processBtn.onclick = async () => {
        const file = videoInput.files[0];
        const text = ttsInput.value;

        if (!file || !text) return alert("Pilih video dan isi teks!");

        processBtn.disabled = true;
        infoStatus.innerText = "Menyiapkan mesin...";

        const videoUrl = URL.createObjectURL(file);
        const sourceVideo = document.createElement('video');
        sourceVideo.src = videoUrl;
        sourceVideo.muted = true; 
        sourceVideo.playsInline = true;

        await sourceVideo.play();

        canvas.width = sourceVideo.videoWidth;
        canvas.height = sourceVideo.videoHeight;

        // Setup RecordRTC
        const recorder = new RecordRTC(canvas, {
            type: 'video',
            mimeType: 'video/webm', // WebM tetap standar browser, tapi kita perbaiki filenya
            disableLogs: false
        });

        recorder.startRecording();
        infoStatus.innerText = "Sedang merekam suara & video...";

        // TTS
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID';
        window.speechSynthesis.speak(utterance);

        const draw = () => {
            if (!sourceVideo.paused && !sourceVideo.ended) {
                ctx.drawImage(sourceVideo, 0, 0, canvas.width, canvas.height);
                requestAnimationFrame(draw);
            }
        };
        draw();

        sourceVideo.onended = () => {
            recorder.stopRecording(() => {
                const blob = recorder.getBlob();
                const finalUrl = URL.createObjectURL(blob);
                
                outputVideo.src = finalUrl;
                downloadLink.href = finalUrl;
                downloadLink.download = "video_tts_siap.mp4"; // Kita beri ekstensi mp4 agar galeri mau baca
                
                outputContainer.style.display = 'block';
                infoStatus.innerText = "Berhasil! Klik simpan.";
                processBtn.disabled = false;
                sourceVideo.remove();
            });
        };
    };
</script>

</body>
</html>
