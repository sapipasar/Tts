<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Ke WA</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid #334155; text-align: center; }
        textarea { width: 100%; height: 100px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 10px; padding: 12px; box-sizing: border-box; margin-bottom: 15px; }
        button { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; background: #0ea5e9; color: white; cursor: pointer; font-size: 16px; }
        #status { margin-top: 15px; font-size: 13px; color: #38bdf8; }
    </style>
</head>
<body>

<div class="card">
    <h2>TTS Simpan MP3</h2>
    <textarea id="txt" placeholder="Ketik pesan untuk WA..."></textarea>
    
    <button id="btn">DOWNLOAD MP3 SEKARANG</button>
    <div id="status">Tulis teks lalu klik tombol.</div>
</div>

<script>
    document.getElementById('btn').onclick = function() {
        const text = document.getElementById('txt').value;
        if (!text) return alert("Teks kosong!");

        document.getElementById('status').innerText = "⏳ Sedang mengunduh...";

        // Menggunakan link yang memicu download otomatis
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=id&client=tw-ob`;
        
        const anchor = document.createElement('a');
        anchor.href = ttsUrl;
        anchor.target = '_blank';
        anchor.download = 'suara_wa.mp3'; // Memaksa nama file mp3
        
        // Simpan ke folder download
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);

        document.getElementById('status').innerText = "✅ Cek folder Download di HP Anda.";
    };
</script>

</body>
</html>
