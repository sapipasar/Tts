<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video TTS Fix Mobile</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
        .box { background: #2a2a2a; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; }
        textarea { width: 100%; height: 80px; margin: 10px 0; border-radius: 5px; padding: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #00bcd4; border: none; color: white; font-weight: bold; border-radius: 10px; cursor: pointer; }
        #log { margin-top: 15px; font-size: 12px; color: #aaa; }
        video { width: 100%; margin-top: 15px; display: none; border-radius: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h3>Video TTS Pro (Final)</h3>
    <p style="font-size: 12px;">Gunakan Chrome / Browser Bawaan</p>
    
    <input type="file" id="vidFile" accept="video/*" style="font-size: 12px; margin-bottom: 10px;">
    <textarea id="txtInput" placeholder="Ketik pesan suara di sini..."></textarea>
    
    <button id="btnGo">PROSES & DOWNLOAD</button>
    <div id="log">Status: Menunggu...</div>
    
    <video id="resVid" controls></video>
</div>

<script>
    const btn = document.getElementById('btnGo');
    const log = document.getElementById('log');

    btn.onclick = async () => {
        const file = document.getElementById('vidFile').files[0];
        const text = document.getElementById('txtInput').value;

        if(!file || !text) return alert("Pilih file dan isi teks!");

        btn.disabled = true;
        log.innerText = "Memulai TTS...";

        // 1. Dapatkan Suara TTS (Google API)
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=id&client=tw-ob`;
        
        try {
            const response = await fetch(ttsUrl);
            const audioBlob = await response.blob();
            const videoUrl = URL.createObjectURL(file);
            const audioUrl = URL.createObjectURL(audioBlob);

            log.innerText = "Video sedang disiapkan...";

            // 2. Karena FFmpeg sering gagal di HP, kita gunakan teknik 'Merge' via elemen Video
            // Kita akan buat link download otomatis untuk file WebM yang paling stabil
            const videoElement = document.createElement('video');
            videoElement.src = videoUrl;
            videoElement.muted = true;
            
            const stream = videoElement.captureStream ? videoElement.captureStream() : videoElement.mozCaptureStream();
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const audioNode = new Audio(audioUrl);
            const audioSource = audioCtx.createMediaElementSource(audioNode);
            const dest = audioCtx.createMediaStreamDestination();
            audioSource.connect(dest);
            
            const combined = new MediaStream([
                ...stream.getVideoTracks(),
                ...dest.stream.getAudioTracks()
            ]);

            const recorder = new MediaRecorder(combined, { mimeType: 'video/webm' });
            let chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' }); // Paksa identitas MP4
                const url = URL.createObjectURL(blob);
                
                // TRIGGER DOWNLOAD LANGSUNG
                const a = document.createElement('a');
                a.href = url;
                a.download = "hasil_video.mp4";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                document.getElementById('resVid').src = url;
                document.getElementById('resVid').style.display = "block";
                log.innerText = "Berhasil! Cek folder Download.";
                btn.disabled = false;
            };

            recorder.start();
            videoElement.play();
            audioNode.play();

            videoElement.onended = () => {
                recorder.stop();
                audioNode.pause();
            };

        } catch (err) {
            log.innerText = "Gagal: " + err.message;
            btn.disabled = false;
        }
    };
</script>

</body>
</html>
