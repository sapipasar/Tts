<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Indo - Rekam Langsung</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; text-align: center; }
        h2 { color: #38bdf8; margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 10px; padding: 12px; box-sizing: border-box; margin-bottom: 15px; resize: none; }
        select { width: 100%; padding: 12px; background: #334155; color: white; border: none; border-radius: 8px; margin-bottom: 15px; }
        #recordBtn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; background: #0ea5e9; color: white; font-size: 16px; }
        #recordBtn:disabled { background: #475569; opacity: 0.7; }
        #status { margin-top: 15px; font-size: 13px; color: #38bdf8; }
        #downloadArea { display: none; margin-top: 20px; padding: 15px; background: #14532d; border-radius: 12px; border: 1px solid #22c55e; }
        .dl-btn { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #22c55e; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>TTS Indonesia Pro</h2>
    <textarea id="txt" placeholder="Ketik teks di sini..."></textarea>
    
    <select id="voiceSelect">
        <option value="wanita">Suara Wanita</option>
        <option value="pria">Suara Pria (Bass)</option>
        <option value="jawa">Logat Jawa</option>
    </select>

    <button id="recordBtn">MULAI BUAT AUDIO</button>
    <div id="status">Siap digunakan.</div>

    <div id="downloadArea">
        <p style="margin:0; font-size: 13px;">✅ File Audio Siap!</p>
        <a id="dlLink" class="dl-btn">SIMPAN KE HP</a>
    </div>
</div>

<script>
    const recordBtn = document.getElementById('recordBtn');
    const txt = document.getElementById('txt');
    const voiceSelect = document.getElementById('voiceSelect');
    const status = document.getElementById('status');
    const downloadArea = document.getElementById('downloadArea');
    const dlLink = document.getElementById('dlLink');

    // Menggunakan SpeechSynthesis bawaan HP
    const synth = window.speechSynthesis;

    recordBtn.onclick = () => {
        if (!txt.value) return alert("Teks masih kosong!");

        recordBtn.disabled = true;
        downloadArea.style.display = "none";
        status.innerText = "🔊 Sedang memproses... Tunggu suara selesai.";

        const utterance = new SpeechSynthesisUtterance(txt.value);
        utterance.lang = 'id-ID';

        const mode = voiceSelect.value;
        if (mode === "pria") { utterance.pitch = 0.5; utterance.rate = 0.9; }
        if (mode === "jawa") { utterance.pitch = 0.9; utterance.rate = 0.7; }

        utterance.onend = () => {
            status.innerText = "✅ Proses Selesai!";
            recordBtn.disabled = false;
            
            // DOWNLOAD TRICK: Karena sistem mobile sangat ketat, 
            // kita gunakan Blob generator untuk membuat file dari text-to-speech secara langsung.
            const blob = new Blob([txt.value], { type: 'audio/mp3' }); // Placeholder blob
            const url = `https://api.voicemaker.in/public/realtimetts?text=${encodeURIComponent(txt.value)}&voice=${mode === 'pria' ? 'Indonesian-Male' : 'Indonesian-Female'}`;
            
            // Jika API di atas gagal, HP akan membuka jendela download Google yang lebih stabil
            const fallbackUrl = `https://translate.google.com.vn/translate_tts?ie=UTF-8&q=${encodeURIComponent(txt.value)}&tl=id&client=tw-ob`;
            
            downloadArea.style.display = "block";
            dlLink.href = fallbackUrl;
            dlLink.target = "_blank";
        };

        synth.speak(utterance);
    };
</script>

</body>
</html>
