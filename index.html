<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Indo Pro</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid #334155; text-align: center; }
        textarea { width: 100%; height: 100px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 10px; padding: 12px; box-sizing: border-box; margin-bottom: 15px; font-size: 16px; }
        select { width: 100%; padding: 12px; background: #334155; color: white; border-radius: 8px; margin-bottom: 15px; border: none; }
        button { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; background: #0ea5e9; color: white; cursor: pointer; font-size: 16px; }
        #downloadArea { display: none; margin-top: 20px; padding: 15px; background: #064e3b; border-radius: 12px; border: 1px solid #22c55e; }
        .dl-btn { display: inline-block; margin-top: 10px; padding: 12px 24px; background: #22c55e; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>TTS INDO</h2>
    <textarea id="txt" placeholder="Ketik di sini..."></textarea>
    
    <select id="voiceOpt">
        <option value="id-ID">Suara Wanita</option>
        <option value="pria">Suara Pria</option>
    </select>

    <button id="btn">AMBIL FILE SUARA</button>

    <div id="downloadArea">
        <p style="margin:0; font-size: 13px;">✅ Link Berhasil Dibuat!</p>
        <a id="dl" class="dl-btn" target="_blank">KLIK UNTUK DOWNLOAD</a>
        <p style="font-size: 11px; margin-top: 10px; color: #94a3b8;">(Jika terbuka player, klik titik 3 lalu Download)</p>
    </div>
</div>

<script>
    const btn = document.getElementById('btn');
    const txt = document.getElementById('txt');
    const voiceOpt = document.getElementById('voiceOpt');
    const downloadArea = document.getElementById('downloadArea');
    const dl = document.getElementById('dl');

    btn.onclick = () => {
        const text = txt.value;
        if (!text) return alert("Isi teks dulu!");

        // Kita gunakan server 'Open Source' yang tidak memblokir browser HP
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=id&client=tw-ob`;
        
        dl.href = ttsUrl;
        downloadArea.style.display = "block";
        
        // Membunyikan suara di HP sebagai preview
        const ut = new SpeechSynthesisUtterance(text);
        ut.lang = 'id-ID';
        if(voiceOpt.value === "pria") ut.pitch = 0.5;
        window.speechSynthesis.speak(ut);
    };
</script>

</body>
</html>
