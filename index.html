<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video TTS Fix Sempurna</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; max-width: 400px; margin: auto; border: 1px solid #334155; }
        textarea { width: 100%; height: 80px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 10px; padding: 10px; box-sizing: border-box; margin: 15px 0; }
        button { width: 100%; padding: 15px; background: #0ea5e9; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #475569; }
        #status { margin-top: 15px; font-size: 13px; color: #38bdf8; }
        video { width: 100%; border-radius: 15px; margin-top: 20px; display: none; background: #000; }
        .dl-btn { display: none; margin-top: 15px; padding: 12px; background: #22c55e; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h3>Video + Suara TTS</h3>
    <input type="file" id="vidInp" accept="video/*">
    <textarea id="txtInp" placeholder="Tulis suara di sini..."></textarea>
    <button id="btnGas">GABUNGKAN SEKARANG</button>
    <div id="status">Siap digunakan.</div>
    
    <video id="vOut" controls playsinline></video>
    <a id="btnDl" class="dl-btn">DOWNLOAD VIDEO</a>
</div>

<canvas id="cv" style="display:none;"></canvas>

<script>
    const btnGas = document.getElementById('btnGas');
    const status = document.getElementById('status');
    const vOut = document.getElementById('vOut');
    const btnDl = document.getElementById('btnDl');
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    btnGas.onclick = async () => {
        const file = document.getElementById('vidInp').files[0];
        const text = document.getElementById('txtInp').value;
        if (!file || !text) return alert("Lengkapi file dan teks!");

        btnGas.disabled = true;
        status.innerText = "Mengambil Suara...";

        // 1. Ambil Suara TTS lewat API luar agar jadi file Audio asli
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=id&client=tw-ob`;
        
        const audio = new Audio();
        audio.crossOrigin = "anonymous";
        audio.src = ttsUrl;

        // 2. Siapkan Video
        const video = document.createElement('video');
        video.src = URL.createObjectURL(file);
        video.muted = true;
        video.playsInline = true;

        video.onloadeddata = async () => {
            cv.width = video.videoWidth;
            cv.height = video.videoHeight;
            
            status.innerText = "Menyatukan Audio & Video...";
            
            const stream = cv.captureStream(30);
            
            // Gabungkan Audio TTS ke Stream
            const audioCtx = new AudioContext();
            const source = audioCtx.createMediaElementSource(audio);
            const dest = audioCtx.createMediaStreamDestination();
            source.connect(dest);
            source.connect(audioCtx.destination); // Supaya terdengar saat proses

            const combined = new MediaStream([
                ...stream.getVideoTracks(),
                ...dest.stream.getAudioTracks()
            ]);

            const recorder = new MediaRecorder(combined, { mimeType: 'video/webm' });
            const chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                vOut.src = url;
                vOut.style.display = "block";
                btnDl.href = url;
                btnDl.download = "video_final.mp4";
                btnDl.style.display = "block";
                status.innerText = "BERHASIL! Silakan Download.";
                btnGas.disabled = false;
            };

            recorder.start();
            video.play();
            audio.play();

            const loop = () => {
                if (!video.paused && !video.ended) {
                    ctx.drawImage(video, 0, 0, cv.width, cv.height);
                    requestAnimationFrame(loop);
                }
            };
            loop();

            video.onended = () => {
                recorder.stop();
                audio.pause();
            };
        };
    };
</script>

</body>
</html>
