<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Indo Pro - No API</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 10px; padding: 12px; box-sizing: border-box; margin-top: 5px; resize: none; }
        select { width: 100%; padding: 12px; background: #334155; color: white; border: none; border-radius: 8px; margin: 10px 0; }
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; background: #0ea5e9; color: white; transition: 0.3s; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status { text-align: center; margin-top: 15px; font-size: 13px; color: #38bdf8; min-height: 20px; }
        #downloadArea { display: none; margin-top: 20px; padding: 15px; background: #064e3b; border-radius: 12px; text-align: center; border: 1px solid #059669; }
        .dl-link { color: #34d399; font-weight: bold; text-decoration: none; font-size: 15px; display: block; }
    </style>
</head>
<body>

<div class="card">
    <h2>TTS Indonesia Pro</h2>
    
    <label style="font-size: 13px; color: #94a3b8;">Tulis Teks:</label>
    <textarea id="txt" placeholder="Halo, pripun kabare mas?"></textarea>

    <label style="font-size: 13px; color: #94a3b8;">Pilih Suara:</label>
    <select id="voiceSelect">
        <option value="wanita">Wanita Indonesia</option>
        <option value="pria">Pria Indonesia (Ngebass)</option>
        <option value="jawa">Logat Jawa (Medok)</option>
    </select>

    <button id="actionBtn">PROSES & SIMPAN SUARA</button>

    <div id="status">Siap.</div>

    <div id="downloadArea">
        <p style="margin:0 0 10px 0; font-size:12px;">✅ Suara berhasil dibuat!</p>
        <a id="finalDl" class="dl-link">DOWNLOAD FILE AUDIO (.mp3)</a>
    </div>
</div>

<script>
    const actionBtn = document.getElementById('actionBtn');
    const txt = document.getElementById('txt');
    const voiceSelect = document.getElementById('voiceSelect');
    const status = document.getElementById('status');
    const downloadArea = document.getElementById('downloadArea');
    const finalDl = document.getElementById('finalDl');

    actionBtn.onclick = () => {
        const text = txt.value;
        if (!text) return alert("Isi teks dulu!");

        downloadArea.style.display = "none";
        actionBtn.disabled = true;
        status.innerText = "🔊 Menghasilkan suara...";

        // Reset TTS
        window.speechSynthesis.cancel();

        const choice = voiceSelect.value;
        let pitch = 1.0;
        let rate = 1.0;

        if (choice === "pria") { pitch = 0.5; rate = 0.9; }
        else if (choice === "jawa") { pitch = 0.9; rate = 0.7; }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID';
        utterance.pitch = pitch;
        utterance.rate = rate;

        utterance.onend = () => {
            status.innerText = "✅ Selesai. Gunakan tombol download di bawah.";
            actionBtn.disabled = false;
            
            // Trik Download Tanpa API: 
            // Kita arahkan ke layanan TTS publik yang tidak butuh kunci/Key
            const encodedText = encodeURIComponent(text);
            const dlUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=id&client=tw-ob`;
            
            downloadArea.style.display = "block";
            finalDl.onclick = (e) => {
                e.preventDefault();
                window.open(dlUrl, '_blank');
            };
        };

        utterance.onerror = () => {
            status.innerText = "❌ Gagal memutar suara.";
            actionBtn.disabled = false;
        };

        window.speechSynthesis.speak(utterance);
    };
</script>

</body>
</html>
