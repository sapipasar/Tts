<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Indo - Rekam Internal</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; text-align: center; }
        textarea { width: 100%; height: 100px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 10px; padding: 12px; box-sizing: border-box; margin-bottom: 15px; resize: none; }
        select { width: 100%; padding: 12px; background: #334155; color: white; border: none; border-radius: 8px; margin-bottom: 15px; }
        button { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; background: #0ea5e9; color: white; font-size: 16px; transition: 0.3s; }
        button:disabled { background: #475569; }
        #status { margin-top: 15px; font-size: 13px; color: #38bdf8; }
        #downloadArea { display: none; margin-top: 20px; padding: 15px; background: #064e3b; border-radius: 12px; border: 1px solid #22c55e; }
        .dl-btn { display: inline-block; margin-top: 10px; padding: 12px 24px; background: #22c55e; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>TTS Indonesia Pro</h2>
    <textarea id="txt" placeholder="Ketik teks di sini..."></textarea>
    
    <select id="voiceSelect">
        <option value="wanita">Suara Wanita</option>
        <option value="pria">Suara Pria</option>
        <option value="jawa">Logat Jawa</option>
    </select>

    <button id="recordBtn">MULAI REKAM & SIMPAN</button>
    <div id="status">Siap.</div>

    <div id="downloadArea">
        <p style="margin:0; font-size: 13px;">✅ Rekaman Selesai!</p>
        <audio id="audioPlayback" controls></audio>
        <br>
        <a id="dlLink" class="dl-btn">DOWNLOAD MP3</a>
    </div>
</div>

<script>
    const recordBtn = document.getElementById('recordBtn');
    const txt = document.getElementById('txt');
    const voiceSelect = document.getElementById('voiceSelect');
    const status = document.getElementById('status');
    const downloadArea = document.getElementById('downloadArea');
    const dlLink = document.getElementById('dlLink');
    const audioPlayback = document.getElementById('audioPlayback');

    recordBtn.onclick = async () => {
        if (!txt.value) return alert("Teks kosong!");

        try {
            recordBtn.disabled = true;
            status.innerText = "🎤 Menyiapkan perekam...";

            // Menggunakan MediaRecorder untuk menangkap suara internal browser
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mediaRecorder = new MediaRecorder(stream);
            let chunks = [];

            mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/mp3' });
                const url = URL.createObjectURL(blob);
                audioPlayback.src = url;
                dlLink.href = url;
                dlLink.download = "suara_saya.mp3";
                downloadArea.style.display = "block";
                status.innerText = "✅ Berhasil disimpan!";
                recordBtn.disabled = false;
                
                // Matikan microphone setelah selesai
                stream.getTracks().forEach(track => track.stop());
            };

            // Mulai TTS
            const utterance = new SpeechSynthesisUtterance(txt.value);
            utterance.lang = 'id-ID';
            const mode = voiceSelect.value;
            if (mode === "pria") { utterance.pitch = 0.5; utterance.rate = 0.9; }
            if (mode === "jawa") { utterance.pitch = 0.9; utterance.rate = 0.7; }

            utterance.onstart = () => {
                mediaRecorder.start();
                status.innerText = "🔴 Sedang merekam suara... (Jangan matikan volume HP)";
            };

            utterance.onend = () => {
                setTimeout(() => mediaRecorder.stop(), 500); // Beri jeda sedikit agar tidak terpotong
            };

            window.speechSynthesis.speak(utterance);

        } catch (err) {
            alert("Izin Microphone ditolak. Berikan izin agar bisa merekam suara.");
            recordBtn.disabled = false;
            status.innerText = "❌ Gagal: Butuh izin mic.";
        }
    };
</script>

</body>
</html>
