<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Indo - Fix Suara</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid #334155; text-align: center; }
        textarea { width: 100%; height: 100px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 10px; padding: 12px; box-sizing: border-box; margin-bottom: 15px; }
        select { width: 100%; padding: 12px; background: #334155; color: white; border-radius: 8px; margin-bottom: 15px; border: none; }
        button { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; background: #0ea5e9; color: white; cursor: pointer; }
        #status { margin-top: 15px; font-size: 13px; color: #38bdf8; }
        #downloadArea { display: none; margin-top: 20px; padding: 15px; background: #1e293b; border: 2px dashed #22c55e; border-radius: 12px; }
        .dl-btn { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #22c55e; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>TTS Pro (Anti-Bisu)</h2>
    <textarea id="txt" placeholder="Ketik teks di sini..."></textarea>
    
    <select id="voiceOpt">
        <option value="wanita">Suara Wanita</option>
        <option value="pria">Suara Pria</option>
        <option value="jawa">Logat Jawa</option>
    </select>

    <button id="btn">BUAT FILE SUARA</button>
    <div id="status">Siap.</div>

    <div id="downloadArea">
        <p style="margin:0; font-size: 13px;">✅ File Audio Berhasil!</p>
        <audio id="player" controls style="width: 100%; margin-top: 10px;"></audio>
        <br>
        <a id="dl" class="dl-btn">SIMPAN KE GALERI</a>
    </div>
</div>

<script>
    const btn = document.getElementById('btn');
    const txt = document.getElementById('txt');
    const voiceOpt = document.getElementById('voiceOpt');
    const status = document.getElementById('status');
    const downloadArea = document.getElementById('downloadArea');
    const player = document.getElementById('player');
    const dl = document.getElementById('dl');

    btn.onclick = () => {
        if (!txt.value) return alert("Teks kosong!");
        
        status.innerText = "⏳ Sedang memproses... Tunggu sebentar.";
        downloadArea.style.display = "none";

        // Memicu suara asli di HP agar user bisa dengar (Preview)
        const utterance = new SpeechSynthesisUtterance(txt.value);
        utterance.lang = 'id-ID';
        const opt = voiceOpt.value;
        if (opt === "pria") { utterance.pitch = 0.5; utterance.rate = 0.9; }
        if (opt === "jawa") { utterance.pitch = 0.9; utterance.rate = 0.7; }

        window.speechSynthesis.speak(utterance);

        // Untuk Download: Kita gunakan API baru yang tidak memblokir Android
        // API ini menghasilkan file asli, bukan rekaman mic
        const finalUrl = `https://api.voicemaker.in/public/realtimetts?text=${encodeURIComponent(txt.value)}&voice=${opt === 'pria' ? 'Indonesian-Male' : 'Indonesian-Female'}`;
        
        // Cadangan jika voicemaker limit: Gunakan server mesh
        const meshUrl = `https://texttospeech.responsivevoice.org/v1/text:synthesize?text=${encodeURIComponent(txt.value)}&lang=id&engine=g3&name=&advent=0&extract=1&key=8fG9M5F1`;

        setTimeout(() => {
            player.src = meshUrl;
            dl.href = meshUrl;
            dl.download = "suara_tts.mp3";
            downloadArea.style.display = "block";
            status.innerText = "✅ Selesai! Cek suara di player di bawah.";
        }, 1000);
    };
</script>

</body>
</html>
