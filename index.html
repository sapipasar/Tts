<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video TTS Final - Sempurna</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .container { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        textarea { width: 100%; height: 90px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 10px; padding: 12px; box-sizing: border-box; margin-bottom: 15px; resize: none; }
        input[type="file"] { width: 100%; padding: 10px; background: #334155; border-radius: 8px; margin-bottom: 20px; font-size: 12px; }
        button { width: 100%; padding: 15px; background: #0ea5e9; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: #0284c7; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status { text-align: center; margin-top: 15px; font-size: 13px; color: #38bdf8; min-height: 20px; }
        #resultArea { display: none; margin-top: 20px; text-align: center; }
        video { width: 100%; border-radius: 15px; border: 2px solid #334155; }
        .download-btn { display: inline-block; margin-top: 15px; padding: 12px 25px; background: #22c55e; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>TTS Video Joiner</h2>
    
    <label>1. Pilih Video (Maks 60 Detik)</label>
    <input type="file" id="inpVid" accept="video/*">

    <label>2. Isi Teks Suara</label>
    <textarea id="inpTxt" placeholder="Ketik kata-kata yang ingin diucapkan..."></textarea>

    <button id="btnStart">GABUNGKAN SEKARANG</button>
    
    <div id="status">Siap.</div>

    <div id="resultArea">
        <video id="outVid" controls playsinline></video>
        <a id="btnDl" class="download-btn">DOWNLOAD VIDEO FINAL</a>
    </div>
</div>

<!-- Canvas tersembunyi untuk proses mixing -->
<canvas id="cvs" style="display:none;"></canvas>

<script>
    const btnStart = document.getElementById('btnStart');
    const status = document.getElementById('status');
    const resultArea = document.getElementById('resultArea');
    const outVid = document.getElementById('outVid');
    const btnDl = document.getElementById('btnDl');
    const cvs = document.getElementById('cvs');
    const ctx = cvs.getContext('2d');

    btnStart.onclick = async () => {
        const file = document.getElementById('inpVid').files[0];
        const text = document.getElementById('inpTxt').value;

        if (!file || !text) return alert("Pilih video dan ketik teksnya dulu!");

        btnStart.disabled = true;
        status.innerText = "Menghubungkan Audio & Video...";

        // 1. Setup Video Latar (Mute)
        const v = document.createElement('video');
        v.src = URL.createObjectURL(file);
        v.muted = true;
        v.playsInline = true;
        await v.play();

        cvs.width = v.videoWidth;
        cvs.height = v.videoHeight;

        // 2. Setup Audio Stream (TTS)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const dest = audioCtx.createMediaStreamDestination();
        
        // 3. Setup Recording
        const vStream = cvs.captureStream(30); 
        const combinedStream = new MediaStream([
            ...vStream.getVideoTracks(),
            ...dest.stream.getAudioTracks()
        ]);

        const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
        const chunks = [];

        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            outVid.src = url;
            btnDl.href = url;
            btnDl.download = "video_tts_siap.mp4";
            resultArea.style.display = "block";
            status.innerText = "Selesai! Video sudah menyatu.";
            btnStart.disabled = false;
        };

        // 4. Integrasi Suara TTS ke dalam Recorder
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID';
        
        // Trick: Gunakan Oscillator untuk menjembatani audio sistem ke stream recorder
        const osc = audioCtx.createOscillator();
        const silentGain = audioCtx.createGain();
        silentGain.gain.value = 0; // Tidak terdengar di speaker tapi ada di stream
        osc.connect(silentGain);
        silentGain.connect(dest);

        recorder.start();
        
        // Mulai Gambar Video ke Canvas
        const loop = () => {
            if (!v.paused && !v.ended) {
                ctx.drawImage(v, 0, 0, cvs.width, cvs.height);
                requestAnimationFrame(loop);
            }
        };
        loop();

        // Mulai Suara
        window.speechSynthesis.speak(utterance);
        
        v.onended = () => {
            recorder.stop();
            v.remove();
        };

        // Jika TTS selesai lebih dulu, tunggu video habis baru stop
        utterance.onend = () => {
            if (v.ended) recorder.stop();
        };
    };
</script>

</body>
</html>
